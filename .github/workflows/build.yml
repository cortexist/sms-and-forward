name: Build

on:
  push:
    branches: [main, play]
  pull_request:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :presentation:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SMS-and-Forward-debug
          path: presentation/build/outputs/apk/debug/*.apk
          retention-days: 14
